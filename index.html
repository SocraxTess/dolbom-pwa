<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>돌봄도 통역 됩니다</title>
<meta name="description" content="두 번 누르면, 말이 통한다. 요양병원 환자·간병사·간호사용 그림 문장 통역 (시험판)">
<meta name="theme-color" content="#1f4e5a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/app.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/app-192.png">
<style>
:root {
  --bg: #f7f3ec; --surface: #ffffff; --ink: #1b2328; --muted: #55616a;
  --line: #d9d2c5; --accent: #1f4e5a; --accent-ink: #ffffff; --accent-soft: #e2eef0;
  --urgent: #b3261e; --urgent-soft: #fde8e6; --caution: #8a5a00; --caution-soft: #fff3d6;
  --radius: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121618; --surface: #1d2326; --ink: #f2f0ea; --muted: #a9b3b8;
    --line: #36403f; --accent: #7cc4cf; --accent-ink: #0d1a1d; --accent-soft: #20343a;
    --urgent: #ff8a80; --urgent-soft: #3a1f1d; --caution: #ffcb6b; --caution-soft: #3a3020; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121618; --surface: #1d2326; --ink: #f2f0ea; --muted: #a9b3b8;
  --line: #36403f; --accent: #7cc4cf; --accent-ink: #0d1a1d; --accent-soft: #20343a;
  --urgent: #ff8a80; --urgent-soft: #3a1f1d; --caution: #ffcb6b; --caution-soft: #3a3020; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK SC", "Malgun Gothic", system-ui, sans-serif;
  font-size: 20px; line-height: 1.4; -webkit-text-size-adjust: 100%;
}
#app { max-width: 560px; margin: 0 auto; padding-block: 16px calc(32px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.pic { display: inline-flex; width: 64px; height: 64px; flex: none; color: var(--accent); }
.pic svg { width: 100%; height: 100%; }

/* 첫 화면 */
.brand { text-align: center; padding: 20px 0 8px; }
.brand h1 { margin: 0; font-size: 34px; letter-spacing: -0.02em; color: var(--accent); }
.slogan { margin: 6px 0 0; font-size: 22px; font-weight: 700; }
.label { font-size: 17px; color: var(--muted); margin: 22px 4px 10px; font-weight: 600; }
.langs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lang { min-height: 72px; border: 3px solid var(--line); background: var(--surface); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.lang b { font-size: 22px; } .lang small { font-size: 14px; color: var(--muted); }
.lang.on { border-color: var(--accent); background: var(--accent-soft); }
.lang:disabled { opacity: .45; cursor: not-allowed; }
.roles { display: grid; gap: 12px; }
.role { display: flex; align-items: center; gap: 18px; min-height: 96px; padding: 12px 20px; border-radius: var(--radius); border: 3px solid var(--line); background: var(--surface); font-size: 30px; font-weight: 800; text-align: left; }
.role small { display: block; font-size: 18px; font-weight: 600; color: var(--muted); }
.role:active, .tile:active, .say:active { transform: scale(.98); }

/* 상단 이동 */
.top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; margin-bottom: 8px; }
.nav { display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 4px 14px 4px 6px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-size: 18px; font-weight: 700; }
.nav .pic { width: 30px; height: 30px; }
.nav span { white-space: nowrap; line-height: 1.15; text-align: left; }
.nav small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
.who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .t-ko, .s-main, .s-sub { word-break: keep-all; }
.nav.ghost { border-style: dashed; font-size: 15px; font-weight: 600; color: var(--muted); }
.who { text-align: center; font-size: 15px; color: var(--muted); }

/* 1단계: 그림 */
.ask { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 28px; margin: 14px 4px 14px; }
.ask small { flex-basis: 100%; font-size: 18px; color: var(--muted); font-weight: 600; }
.ask .pic { width: 44px; height: 44px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 168px; padding: 14px 8px; border-radius: var(--radius); border: 3px solid var(--line); background: var(--surface); font-size: 24px; font-weight: 800; text-align: center; }
.tile .pic { width: 84px; height: 84px; }
.tile .t-tr { font-size: 17px; font-weight: 600; color: var(--muted); }
.tile.urgent, .say.urgent { border-color: var(--urgent); background: var(--urgent-soft); }
.tile.urgent .pic, .say.urgent .pic { color: var(--urgent); }
.hint { text-align: center; color: var(--muted); font-size: 17px; margin-top: 16px; }

/* 2단계: 문장 */
.list { display: grid; gap: 12px; }
.say { display: flex; align-items: center; gap: 16px; min-height: 96px; padding: 14px 18px; border-radius: var(--radius); border: 3px solid var(--line); background: var(--surface); text-align: left; }
.say .pic { width: 56px; height: 56px; }
.s-main { display: block; font-size: 27px; font-weight: 800; line-height: 1.25; }
.s-sub { display: block; font-size: 18px; color: var(--muted); margin-top: 4px; }

/* 결과 */
.dir { text-align: center; color: var(--muted); font-size: 17px; margin: 8px 0; font-weight: 600; }
.card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 26px 18px; border-radius: 26px; background: var(--surface); border: 3px solid var(--accent); }
.card .pic { width: 72px; height: 72px; }
.card.urgent { border-color: var(--urgent); } .card.urgent .pic { color: var(--urgent); }
.card.caution { border-color: var(--caution); } .card.caution .pic { color: var(--caution); }
.big { margin: 0; font-size: clamp(34px, 10vw, 48px); font-weight: 900; line-height: 1.2; word-break: keep-all; }
.small { margin: 0; font-size: 22px; color: var(--muted); word-break: keep-all; }
.play { width: 100%; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 84px; border: none; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink); font-size: 24px; font-weight: 800; }
.play .pic { color: var(--accent-ink); width: 44px; height: 44px; }
.voice-status { min-height: 1.4em; text-align: center; color: var(--caution); font-weight: 700; font-size: 17px; }
.warn { padding: 14px 16px; border-radius: 16px; background: var(--urgent-soft); color: var(--ink); font-size: 17px; border-left: 6px solid var(--urgent); }
.warn b { display: block; color: var(--urgent); margin-bottom: 4px; }
.testonly { text-align: center; font-size: 14px; color: var(--muted); margin-top: 14px; }
.notice { margin-top: 26px; padding: 14px 16px; border-radius: 14px; background: var(--caution-soft); font-size: 15px; color: var(--ink); }
.sign { text-align: center; font-size: 13px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
.sign .ver { font-size: 12px; }
.inapp { display: grid; gap: 6px; margin: 0 auto; max-width: 560px; padding: 14px 16px; background: var(--urgent-soft); border-bottom: 4px solid var(--urgent); font-size: 17px; }
.inapp b { color: var(--urgent); font-size: 19px; }
.inapp button { min-height: 60px; border: none; border-radius: 14px; background: var(--urgent); color: #fff; font-size: 20px; font-weight: 800; }
.inapp small { color: var(--muted); font-size: 14px; } .inapp .u { user-select: all; word-break: break-all; color: var(--ink); }
button:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"><p style="text-align:center;margin-top:40vh">불러오는 중…</p></main>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
